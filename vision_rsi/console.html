<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vision RSI · 任务控制台</title>
<style>body{font:16px system-ui;margin:0;background:#f4f6f9;color:#17243a}main{max-width:1100px;margin:auto;padding:30px}header{border-bottom:1px solid #ccd5e0;padding-bottom:20px}small{color:#52637c}article{background:white;padding:24px;border-radius:12px;margin:18px 0}input,textarea{box-sizing:border-box;display:block;width:100%;padding:12px;margin:12px 0;font:inherit;border:1px solid #bac7d8;border-radius:6px}textarea{min-height:100px}button{padding:10px 16px;background:#1b4dcc;color:white;border:0;border-radius:6px;cursor:pointer;margin:4px}button:disabled{opacity:.5}pre{white-space:pre-wrap;overflow-wrap:anywhere}#error{color:#b42318}.layout{display:grid;grid-template-columns:280px 1fr;gap:20px}@media(max-width:700px){.layout{grid-template-columns:1fr}}.notice{background:#fff4d6;padding:14px;border-radius:6px}</style>
<main><header><h1>Vision RSI Agent</h1><small>任务控制台 · 服务器运行</small></header><p class="notice">当前可提交并澄清需求、查看冻结接口与资源问题。此控制台尚未接入训练调度和正式推理；不会因提交需求自动占用 GPU。</p><p id="error" role="alert"></p>
<div class="layout"><aside><article><h2>任务</h2><div id="tasks"></div><button id="refresh">刷新</button></article></aside><section><article><h2>新建任务</h2><form id="create"><input id="task" placeholder="任务代号，例如 catdog" required><textarea id="goal" placeholder="描述目标、输入、输出和效果要求" required maxlength="4000"></textarea><button>保存任务</button></form></article><article><h2>任务工作台</h2><pre id="summary">选择或新建任务</pre><form id="reply"><textarea id="message" placeholder="用自然语言补充需求；发送会调用 LLM" maxlength="4000" required></textarea><button id="send" disabled>发送并澄清</button></form><details><summary>完整任务记录与资源问题</summary><pre id="record"></pre></details></article></section></div></main>
<script>const token='__TOKEN__';let selected=null;async function api(path,data){const r=await fetch(path,{method:data?'POST':'GET',headers:{'X-Agent-Token':token,'Content-Type':'application/json'},...(data?{body:JSON.stringify(data)}:{})});const v=await r.json();if(!r.ok)throw Error(v.error||'请求失败');return v}async function show(id){selected=id;const v=await api('/api/tasks/'+id);document.querySelector('#summary').textContent=v.summary;document.querySelector('#record').textContent=JSON.stringify(v,null,2);document.querySelector('#send').disabled=false}async function refresh(){const rows=await api('/api/tasks');const list=document.querySelector('#tasks');list.replaceChildren();for(const row of rows){const b=document.createElement('button');b.textContent=row.task_id||row.task||row.session_id;b.onclick=()=>safe(()=>show(row.session_id||row.id));list.append(b)}if(selected)await show(selected)}async function safe(fn){try{document.querySelector('#error').textContent='';await fn()}catch(e){document.querySelector('#error').textContent=e.message}}document.querySelector('#refresh').onclick=()=>safe(refresh);document.querySelector('#create').onsubmit=e=>{e.preventDefault();safe(async()=>{const v=await api('/api/tasks',{task_id:document.querySelector('#task').value,goal:document.querySelector('#goal').value});await show(v.session_id);await refresh()})};document.querySelector('#reply').onsubmit=e=>{e.preventDefault();const b=document.querySelector('#send');b.disabled=true;safe(async()=>{try{await api('/api/tasks/'+selected+'/reply',{message:document.querySelector('#message').value});document.querySelector('#message').value='';await show(selected)}finally{b.disabled=false}})};safe(refresh);</script></html>
