<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vision RSI Agent</title>
<style>body{margin:0;background:#0b1220;color:#e2e8f0;font:16px system-ui;line-height:1.6}main{display:grid;grid-template-columns:300px 1fr;min-height:100vh}aside{background:#111d30;padding:22px;border-right:1px solid #334155}section{padding:30px;max-width:1000px}h1{margin:0;font-size:28px}small{color:#94a3b8}textarea{box-sizing:border-box;width:100%;min-height:120px;background:#182438;color:white;border:1px solid #475569;padding:12px;border-radius:8px;font:inherit}button{background:#22324a;color:white;border:1px solid #475569;border-radius:6px;padding:9px 14px;cursor:pointer;margin:6px 6px 6px 0}button:disabled{opacity:.5;cursor:default}#submit{background:#0f766e}.task{display:block;width:100%;text-align:left;overflow-wrap:anywhere}.selected{border-color:#5eead4}.notice{color:#fbbf24}.event{background:#182438;border-radius:8px;padding:16px;margin:12px 0}.type{color:#5eead4}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px monospace}summary{cursor:pointer}#error{color:#fda4af}#goal{white-space:pre-wrap;overflow-wrap:anywhere} @media(max-width:800px){main{grid-template-columns:1fr}aside{border-bottom:1px solid #334155}section{padding:20px}}</style>
<main><aside><h1>Vision RSI</h1><small>任务工作台 · 本地运行</small><p>任务列表</p><div id="tasks"></div><p><small>任务与研究记录保存在本地，关闭页面不会停止服务。执行中退出服务后，需检查并手动继续。</small></p></aside>
<section><h2>提交研究任务</h2><p class="notice">当前可执行：仓库检查、SSH 环境核查、证据总结。尚不支持训练、代码修改或自我改进验证。</p>
<form id="form"><textarea id="objective" aria-label="研究任务" maxlength="4000" placeholder="例如：检查当前视觉研究 Agent 的代码与远端环境，识别实现长程研究循环的关键缺口，给出有证据的下一步计划。" required></textarea><button id="submit">提交并运行</button><small>每任务最多 6 次真实模型规划，结果不代表研究目标已达成。</small></form><p id="error" role="alert"></p>
<hr><h2 id="goal">选择任务查看执行过程</h2><p id="status"></p><button id="pause" disabled>暂停</button><button id="resume" disabled>继续</button><span id="usage"></span><div id="events"></div></section></main>
<script>const token='__TOKEN__';let selected=null,tasks=[],busy=false,last='';const states={queued:'排队中',running:'执行中',pause_requested:'正在暂停（等待当前行动结束）',paused:'已暂停',failed:'失败，可查看错误',interrupted:'执行中断，需检查后继续',round_finished:'本轮结束（只读能力边界）'};
async function api(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:{'X-Agent-Token':token,'Content-Type':'application/json'},...(body?{body:JSON.stringify(body)}:{})});const data=await r.json();if(!r.ok)throw Error(data.error||'请求失败');return data}
async function refresh(){if(busy)return;busy=true;try{tasks=await api('/api/tasks');const list=document.querySelector('#tasks');list.replaceChildren();for(const t of tasks){let b=document.createElement('button');b.className='task'+(t.id===selected?' selected':'');b.textContent=t.objective.slice(0,48)+' · '+states[t.status];b.onclick=()=>{selected=t.id;last='';refresh()};list.append(b)}if(!selected&&tasks.length)selected=tasks[0].id;
const task=tasks.find(t=>t.id===selected);if(task){document.querySelector('#goal').textContent=task.objective;document.querySelector('#status').textContent=states[task.status]+(task.error?' · '+task.error:'');document.querySelector('#pause').disabled=!['queued','running'].includes(task.status);document.querySelector('#resume').disabled=!['paused','failed','interrupted'].includes(task.status);
const events=await api('/api/tasks/'+selected);let total=0;for(const e of events)total+=e.payload.response?.usage?.total_tokens||0;document.querySelector('#usage').textContent='事件 '+events.length+' · 已报告 API tokens '+total;const signature=selected+':'+events.length;if(last!==signature){last=signature;const root=document.querySelector('#events');root.replaceChildren();for(const e of [...events].reverse()){const a=document.createElement('article');a.className='event';let kind=document.createElement('div');kind.className='type';kind.textContent='#'+e.seq+' · '+e.kind+' · '+new Date(e.created_at).toLocaleString('zh-CN',{timeZone:'Asia/Shanghai'});let p=document.createElement('p');p.textContent=e.payload.summary;let d=document.createElement('details'),s=document.createElement('summary'),pre=document.createElement('pre');s.textContent='查看规划、证据与工具结果';pre.textContent=JSON.stringify(e,null,2);d.append(s,pre);a.append(kind,p,d);root.append(a)}}}document.querySelector('#error').textContent=''}catch(e){document.querySelector('#error').textContent=e.message}finally{busy=false}}
document.querySelector('#form').onsubmit=async(e)=>{e.preventDefault();const button=document.querySelector('#submit');button.disabled=true;try{const r=await api('/api/tasks',{objective:document.querySelector('#objective').value,request_key:crypto.randomUUID()});selected=r.id;last='';document.querySelector('#objective').value='';await refresh()}catch(error){document.querySelector('#error').textContent=error.message}finally{button.disabled=false}};
for(const action of ['pause','resume'])document.querySelector('#'+action).onclick=async()=>{try{await api('/api/tasks/'+selected+'/'+action,{});await refresh()}catch(e){document.querySelector('#error').textContent=e.message}};refresh();setInterval(refresh,2000);</script></html>
