[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vision-rsi-agent"
version = "0.1.0.dev9"
description = "Contract-driven visual research and capability agent"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
media = ["Pillow==12.3.0"]
coco = ["pycocotools==2.0.11", "Pillow==12.3.0"]

[project.scripts]
vision-rsi = "vision_rsi.cli:main"

[tool.setuptools.packages.find]
include = ["vision_rsi*"]

[tool.setuptools.package-data]
vision_rsi = ["*.html"]
